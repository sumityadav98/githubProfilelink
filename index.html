<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub Profile Finder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>GitHub Profile Finder</h1>

        <p>Search any GitHub username</p>

        <div class="search-box">

            <input
                type="text"
                id="username"
                placeholder="Enter GitHub username"
            >

            <button id="searchBtn">
                Get Profile
            </button>

        </div>


        <div id="loading" class="loading hidden">
            Loading...
        </div>


        <div id="error" class="error hidden"></div>


        <div id="profile" class="profile hidden">

            <div class="profile-top">

                <img id="avatar" src="" alt="GitHub Profile">

                <div>
                    <h2 id="name"></h2>

                    <p id="login"></p>

                    <a
                        id="githubLink"
                        href="#"
                        target="_blank">
                        View GitHub Profile
                    </a>
                </div>

            </div>


            <div class="bio">
                <p id="bio"></p>
            </div>


            <div class="stats">

                <div>
                    <h3 id="repos">0</h3>
                    <span>Repositories</span>
                </div>

                <div>
                    <h3 id="followers">0</h3>
                    <span>Followers</span>
                </div>

                <div>
                    <h3 id="following">0</h3>
                    <span>Following</span>
                </div>

            </div>


            <div class="details">

                <div>
                    <span>Location</span>
                    <strong id="location">-</strong>
                </div>

                <div>
                    <span>Company</span>
                    <strong id="company">-</strong>
                </div>

                <div>
                    <span>Public Gists</span>
                    <strong id="gists">-</strong>
                </div>

                <div>
                    <span>Account Created</span>
                    <strong id="created">-</strong>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
